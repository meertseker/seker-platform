name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Yerel Supabase (RLS testleri için)
        working-directory: packages/db
        run: pnpm exec supabase start
      - name: Test ortam değişkenleri
        working-directory: packages/db
        run: |
          pnpm exec supabase status -o json > /tmp/sb.json
          URL=$(jq -r '.API_URL' /tmp/sb.json)
          PUB=$(jq -r '.PUBLISHABLE_KEY' /tmp/sb.json)
          SEC=$(jq -r '.SECRET_KEY' /tmp/sb.json)
          for v in "$URL" "$PUB" "$SEC"; do
            if [ -z "$v" ] || [ "$v" = "null" ]; then
              echo "supabase status çıktısında beklenen anahtar eksik" >&2
              exit 1
            fi
          done
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUB"
            echo "SUPABASE_SECRET_KEY=$SEC"
          } >> "$GITHUB_ENV"
      - run: pnpm turbo run lint typecheck test
      # Deploy'daki Docker build ile aynı next build; prerender hataları main'e girmeden yakalanır.
      - name: next build (web + panel)
        run: pnpm turbo run build --filter=@seker/web --filter=@seker/panel
