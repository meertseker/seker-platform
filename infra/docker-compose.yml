name: seker

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_HOST: ${SITE_HOST}
      PANEL_HOST: ${PANEL_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - panel

  web:
    image: ghcr.io/${GHCR_OWNER}/seker-web:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      LEAD_NOTIFICATION_EMAIL: ${LEAD_NOTIFICATION_EMAIL}
      LEAD_FROM_EMAIL: ${LEAD_FROM_EMAIL}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN}
      PANEL_URL: ${PANEL_URL}
      AWS_ACCESS_KEY_ID: ${MEDIA_AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${MEDIA_AWS_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      AWS_REGION: ${S3_REGION}
    volumes:
      - web_cache:/app/apps/web/.next/cache
    mem_limit: 600m

  panel:
    image: ghcr.io/${GHCR_OWNER}/seker-panel:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN}
      SITE_URL: ${SITE_URL}
      CRON_SECRET: ${CRON_SECRET}
      GOOGLE_ADS_CLIENT_ID: ${GOOGLE_ADS_CLIENT_ID:-}
      GOOGLE_ADS_CLIENT_SECRET: ${GOOGLE_ADS_CLIENT_SECRET:-}
      GOOGLE_ADS_REFRESH_TOKEN: ${GOOGLE_ADS_REFRESH_TOKEN:-}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${GOOGLE_ADS_LOGIN_CUSTOMER_ID:-}
      GOOGLE_ADS_CUSTOMER_ID: ${GOOGLE_ADS_CUSTOMER_ID:-}
      GOOGLE_ADS_CONVERSION_ACTION_RANDEVU: ${GOOGLE_ADS_CONVERSION_ACTION_RANDEVU:-}
      GOOGLE_ADS_CONVERSION_ACTION_KAYIT: ${GOOGLE_ADS_CONVERSION_ACTION_KAYIT:-}
      GA4_PROPERTY_ID: ${GA4_PROPERTY_ID:-}
      WAHA_URL: ${WAHA_URL:-}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
    mem_limit: 700m

  # WhatsApp HTTP API: okulun numarası "bağlı cihaz" olarak buradan bağlanır.
  # Yalnızca iç ağda; dışarıya port açılmaz, QR panelin Ayarlar ekranından okutulur.
  waha:
    image: devlikeapro/waha:gows-2026.9.2
    restart: unless-stopped
    environment:
      TZ: Europe/Istanbul
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_DASHBOARD_ENABLED: "False"
      WHATSAPP_SWAGGER_ENABLED: "False"
      WAHA_PRINT_QR: "False"
      WAHA_CLIENT_DEVICE_NAME: "Seker Panel"
      WAHA_LOG_LEVEL: warn
    volumes:
      - waha_sessions:/app/.sessions
    # Boşta ~330-450 MB (Node + Go); 350m sınırında da çalışıyor ama dar.
    mem_limit: 450m

  cron:
    build: ./cron
    restart: unless-stopped
    environment:
      TZ: Europe/Istanbul
      CRON_SECRET: ${CRON_SECRET}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET}
      AWS_DEFAULT_REGION: ${S3_REGION}
      AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY}
      HC_BACKUP_URL: ${HC_BACKUP_URL}
      HC_CRON_DAILY_URL: ${HC_CRON_DAILY_URL}
    depends_on:
      - panel
    mem_limit: 256m

volumes:
  caddy_data:
  caddy_config:
  web_cache:
  waha_sessions:
